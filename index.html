    <style>
        /* Animaciones personalizadas */
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Ajuste de scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }
        
        .scroll-smooth-offset { scroll-margin-top: 130px; }
        
        /* Toggle Switch para repetidas */
        .toggle-checkbox:checked { right: 0; border-color: #4ade80; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4ade80; }
        .toggle-checkbox:checked + .toggle-label:before { transform: translateX(100%); }

        .repeat-pill {
            background: linear-gradient(135deg, rgba(56,189,248,0.95), rgba(59,130,246,0.95), rgba(79,70,229,0.95));
            box-shadow: 0 8px 18px rgba(37,99,235,0.35);
        }
        .repeat-pill-soft {
            background: linear-gradient(135deg, rgba(14,165,233,0.88), rgba(37,99,235,0.88));
            box-shadow: 0 6px 14px rgba(14,165,233,0.25);
        }
        .sticker-metal::after {
            content: '';
            position: absolute;
            inset: -35% auto -35% -55%;
            width: 55%;
            transform: rotate(24deg);
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.42), rgba(255,255,255,0));
            animation: metalShine 3.6s linear infinite;
            pointer-events: none;
        }
        @keyframes metalShine {
            0% { transform: translateX(-160%) rotate(24deg); opacity: .15; }
            35% { opacity: .6; }
            100% { transform: translateX(320%) rotate(24deg); opacity: .05; }
        }
        .team-progress-track {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.25);
        }
        .team-progress-fill {
            box-shadow: 0 0 12px rgba(74,222,128,0.35);
        }
    </style>
</head>

        // --- CONSTANTES ---

            'ALG': { name: 'Argelia', code: 'dz', colors: ['#006233', '#FFFFFF', '#D21034'] },
            'AUT': { name: 'Austria', code: 'at', colors: ['#ED2939', '#FFFFFF', '#990000'] },
            'JOR': { name: 'Jordania', code: 'jo', colors: ['#CE1126', '#FFFFFF', '#007A3D'] },
            'POR': { name: 'Portugal', code: 'pt', colors: ['#FF0000', '#006600', '#FFCE00'] },
            'COD': { name: 'R.D. Congo', code: 'cd', colors: ['#007FFF', '#FCD116', '#CE1021'] },
            'UZB': { name: 'Uzbekistán', code: 'uz', colors: ['#0099B5', '#FFFFFF', '#1EB53A'] },
            'COL': { name: 'Colombia', code: 'co', colors: ['#FCD116', '#003893', '#CE1126'] },
            'ENG': { name: 'Inglaterra', code: 'gb-eng', colors: ['#FFFFFF', '#CE1124', '#002868'] },
            'CRO': { name: 'Croacia', code: 'hr', colors: ['#FF0000', '#FFFFFF', '#171796'] },
            'GHA': { name: 'Ghana', code: 'gh', colors: ['#CE1126', '#FCD116', '#006B3F'] },
            'PAN': { name: 'Panamá', code: 'pa', colors: ['#DA291C', '#FFFFFF', '#0033A0'] },
            'CC': { name: 'Coca-Cola', code: 'cc', colors: ['#E3000F', '#FFFFFF', '#000000'] }
        };

        // --- ESTADO GLOBAL ---
        const state = {
            firebaseUser: null,
            isFirebaseReady: false,
            virtualUser: null, // {id, fullName}
            albumData: {},
            allUsersData: [],
            tradesData: [], // Almacena notificaciones e intercambios
            currentTab: 'album', // 'album', 'market', 'trade', 'notifications'
            loading: true,
            saving: false,
            dbError: '',
            isNewUserMode: false,
            showClearConfirm: false,
            showPrintModal: false,
            showManualTradeModal: false,
            isRepetidasMode: false, // MODO: SOLO TILDAR REPETIDAS
            voiceStatus: 'Listo para escuchar. Ej: Argentina 1 2 3, Brasil 10 al 15, o borrar México 5.',
            selectedMarketUser: null,
            tradeDraft: null, // { toUser, request: [], offer: [] }
            manualTradeDraft: { given: [], received: [] },
            manualTradeForm: { givenTeam: TEAMS[0], recTeam: TEAMS[0] }
        };
        window.state = state;

        // Función segura para cargar iconos
        function loadIconsSafely() {
            if (typeof window.lucide !== 'undefined') {
                window.lucide.createIcons();
            }
        }

        // --- INICIALIZACIÓN ---
        async function init() {
            render();

            setTimeout(() => {
                if (state.loading) {
                    state.loading = false;
                    if(state.firebaseUser) render();
                    else {
                       state.dbError = "La conexión con la base de datos está tardando demasiado.";
                       render();
                    }
                }
            }, 3000);

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); } 
                    catch (e) { await signInAnonymously(auth); }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) { console.error("Auth error:", error); }

            onAuthStateChanged(auth, (user) => {
                state.firebaseUser = user;
                state.isFirebaseReady = true;
                if (!user) {
                    state.loading = false;
                    render();
                } else {
                    listenToDatabase();
                }
            });
        }

        function listenToDatabase() {
            const usersRef = collection(db, 'artifacts', projectId, 'public', 'data', 'sticker_users');
            onSnapshot(usersRef, (snapshot) => {
                const users = [];
                snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
                state.allUsersData = users;
                
                state.loading = false; 
                state.dbError = '';
                
                if (state.virtualUser) {
                    const myData = users.find(u => u.id === state.virtualUser.id);
                    if (myData && myData.album) {
                        state.albumData = myData.album;
                    }
                }
                
                if(state.allUsersData.length === 0) state.isNewUserMode = true;
                
                if (state.currentTab !== 'album') render(); 
                else if(document.getElementById('stat-percent')) updateGlobalStatsOnly(); 
                else render();
                
            }, (error) => {
                state.dbError = "Permiso denegado al leer la base de datos de Firebase.";
                state.loading = false;
                render();
            });

            // Escuchar intercambios (Notificaciones)
            const tradesRef = collection(db, 'artifacts', projectId, 'public', 'data', 'sticker_trades');
            onSnapshot(tradesRef, (snapshot) => {
                const trades = [];
                snapshot.forEach(doc => trades.push({ id: doc.id, ...doc.data() }));
                state.tradesData = trades;
                if (state.virtualUser) render(); 
            });
        }

        // --- LÓGICA DE NEGOCIO ---
        window.handleLoginSubmit = async (event) => {
            event.preventDefault();
            if (!state.firebaseUser) return alert("⚠️ No hay conexión con Firebase.");
            
            const name = document.getElementById('loginName')?.value || '';
            const pin = document.getElementById('loginPin').value;
            let userId = '';
            let fullName = '';

            if (state.isNewUserMode) {
                fullName = name;
                userId = fullName.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
            } else {
                const selectElement = document.getElementById('loginSelect');
                userId = selectElement.value;
                const found = state.allUsersData.find(u => u.id === userId);
                if(found) fullName = found.fullName;
            }

            if (!userId || pin.length !== 4) return alert("Verifica los datos ingresados.");

            state.loading = true; render();

            try {
                const userRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_users', userId);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    if (data.pin === pin) {
                        state.virtualUser = { id: userId, fullName: data.fullName };
                        state.albumData = data.album || {};
                    } else alert("PIN incorrecto.");
                } else {
                    if (!state.isNewUserMode) alert("El usuario ya no existe.");
                    else {
                        const newUser = { fullName, pin, album: {}, createdAt: new Date().toISOString() };
                        await setDoc(userRef, newUser);
                        state.virtualUser = { id: userId, fullName };
                        state.albumData = {};
                    }
                }
            } catch (error) { state.dbError = "Error guardando datos: " + error.message; }
            state.loading = false; render();
        };

        window.handleLogout = () => {
            state.virtualUser = null;
            state.albumData = {};
            state.currentTab = 'album';
            render();
        };

        window.toggleRepetidasMode = () => {
            state.isRepetidasMode = !state.isRepetidasMode;
            render(); 
        };

        async function saveAlbumData() {
            if (!state.virtualUser || !state.firebaseUser) return;
            const userRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_users', state.virtualUser.id);
            await setDoc(userRef, { album: state.albumData }, { merge: true });
        }

        function refreshStickerAndStats(team, number) {
            const wrap = document.getElementById(`sticker-wrap-${team}-${number}`);
            if(wrap) wrap.innerHTML = getStickerInnerHtml(team, number);
            updateGlobalStatsOnly();
            updateTeamCounterOnly(team);
            loadIconsSafely();
        }

        // Función de toggle figurita en Mi Álbum
        window.toggleSticker = async (team, number) => {
            if (!state.virtualUser || !state.firebaseUser) return;
            if (!state.albumData) state.albumData = {};
            if (!state.albumData[team]) state.albumData[team] = {};
            
            const currentState = state.albumData[team][number] || 0;
            let nextState;

            if (state.isRepetidasMode) {
                if (currentState === 0 || currentState === 1) nextState = 2; // Pasa a tener 1 repetida (+1)
                else if (currentState >= 2 && currentState < 4) nextState = currentState + 1; // Suma otra repetida
                else nextState = 1; // Resetea a "solo la tengo", borra las repetidas
            } else {
                // Modo normal: un toque marca, otro toque suma repetida. Para sacar la figurita se usa la X.
                nextState = currentState === 0 ? 1 : Math.min(currentState + 1, 4);
            }
            
            state.albumData[team][number] = nextState;
            refreshStickerAndStats(team, number);

            try { await saveAlbumData(); }
            catch (error) { console.error("Error guardando figurita", error); }
        };

        window.clearSticker = async (team, number, event) => {
            if(event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (!state.virtualUser || !state.firebaseUser) return false;

            const previousAlbum = JSON.parse(JSON.stringify(state.albumData || {}));

            if (state.albumData && state.albumData[team]) {
                delete state.albumData[team][number];
                if (Object.keys(state.albumData[team]).length === 0) delete state.albumData[team];
            }

            refreshStickerAndStats(team, number);

            try {
                const userRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_users', state.virtualUser.id);
                await updateDoc(userRef, { [`album.${team}.${number}`]: deleteField() });
                if (!state.albumData[team] || Object.keys(state.albumData[team]).length === 0) {
                    await updateDoc(userRef, { [`album.${team}`]: deleteField() });
                }
                await saveAlbumData(state.albumData);
            } catch (error) {
                console.error("Error quitando figurita", error);
                state.albumData = previousAlbum;
                refreshStickerAndStats(team, number);
                alert("No se pudo quitar la figurita de Firebase. Revisá la conexión e intentalo de nuevo.");
            }
            return false;
        };

        window.handleClearAlbum = async () => {
            if (!state.virtualUser || !state.firebaseUser) return;
            try {
                const userRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_users', state.virtualUser.id);
                await setDoc(userRef, { album: {} }, { merge: true });
                state.albumData = {}; 
                state.showClearConfirm = false;
                render(); 
            } catch (error) { console.error(error); }
        };

        // --- SISTEMA DE IMPRESIÓN ---
        window.openPrintModal = () => { state.showPrintModal = true; renderModalOnly(); };
        window.closePrintModal = () => { state.showPrintModal = false; renderModalOnly(); };
        
        window.executeDownload = (type) => {
            // Mostrar estado de carga en el botón
            const btn = document.getElementById(`btn-download-${type}`);
            const originalText = btn ? btn.innerText : '';
            if (btn) {
                btn.innerHTML = `<div class="animate-spin rounded-full h-4 w-4 border-t-2 border-b-2 border-white inline-block mr-2 align-middle"></div> Generando...`;
                btn.disabled = true;
            }

            const titleMap = { 'faltantes': 'FALTANTES', 'obtenidas': 'OBTENIDAS', 'repetidas': 'REPETIDAS' };
            const title = titleMap[type] || 'LISTA';
            
            // 1. Crear el contenedor invisible de la imagen
            const container = document.createElement('div');
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.style.top = '0';
            container.style.width = '800px';
            container.style.backgroundColor = '#ffffff';
            container.style.padding = '40px';
            container.style.fontFamily = "'Helvetica Neue', Arial, sans-serif";
            container.style.color = '#333';
            container.style.zIndex = '-1';
            
            let totalFound = 0;
            let listHtml = '';
            
            const sortedTeams = [...TEAMS].sort((a,b) => (TEAM_DETAILS[a]?.name || a).localeCompare((TEAM_DETAILS[b]?.name || b)));
            
            sortedTeams.forEach(team => {
                const details = TEAM_DETAILS[team] || {name: team};
                const count = getStickerCount(team);
                let list = [];
                for(let i=1; i<=count; i++) {
                    const st = (state.albumData && state.albumData[team] && state.albumData[team][i]) || 0;
                    if(type === 'faltantes' && st === 0) list.push(i);
                    if(type === 'obtenidas' && st >= 1) list.push(i);
                    if(type === 'repetidas' && st > 1) {
                        const reps = st - 1;
                        list.push(reps > 1 ? `<b>${i} (x${reps})</b>` : i);
                    }
                }
                if(list.length > 0) {
                    totalFound += list.length;
                    listHtml += `
                    <div style="margin-bottom: 15px; page-break-inside: avoid; break-inside: avoid-column; border-left: 4px solid #1e40af; padding-left: 10px;">
                        <div style="font-weight: 900; font-size: 16px; color: #111; margin-bottom: 4px; text-transform: uppercase;">${details.name} <span style="color:#888; font-weight:normal; font-size:12px;">(${list.length})</span></div>
                        <div style="color: #444; font-size: 15px; line-height: 1.6;">${list.join(', ')}</div>
                    </div>`;
                }
            });
            
            container.innerHTML = `
                <h1 style="color: #1e40af; border-bottom: 3px solid #1e40af; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; margin-top:0;">Mi Álbum 2026: ${title}</h1>
                <div style="font-weight: bold; color: #047857; margin-bottom: 30px; font-size: 16px; background: #f0fdf4; padding: 10px; border-radius: 8px; display: inline-block;">Total figuritas listadas: ${totalFound}</div>
                <div style="column-count: 2; column-gap: 40px;">
                    ${listHtml}
                </div>
                <div style="margin-top: 40px; font-size: 12px; color: #aaa; text-align: right; border-top: 1px solid #eee; padding-top: 10px;">Generado por Planilla Virtual Mundial 2026</div>
            `;
            
            document.body.appendChild(container);
            
            // 2. Tomar "foto" del contenedor y descargar
            setTimeout(async () => {
                try {
                    const canvas = await html2canvas(container, {
                        scale: 2, // Escala para alta resolución HD
                        backgroundColor: '#ffffff',
                        useCORS: true
                    });
                    
                    const imgData = canvas.toDataURL('image/png');
                    
                    // 3. Ejecutar descarga

        function normalizeVoiceText(text) {
            return (text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        const NUMBER_WORDS = {
            uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10,
            once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20
        };

        function extractVoiceNumbers(text, max) {
            const normalized = normalizeVoiceText(text);
            const tokens = normalized.split(' ');
            const converted = tokens.map(t => NUMBER_WORDS[t] || t).join(' ');
            const numbers = [];

            const rangeMatch = converted.match(/(\d+)\s*(?:al|a|hasta)\s*(\d+)/);
            if (rangeMatch) {
                const start = parseInt(rangeMatch[1]);
                const end = parseInt(rangeMatch[2]);
                const min = Math.min(start, end);
                const top = Math.max(start, end);
                for(let i=min; i<=top; i++) if(i >= 1 && i <= max) numbers.push(i);
            }

            const all = converted.match(/\d+/g) || [];
            all.forEach(n => {
                const value = parseInt(n);
                if(value >= 1 && value <= max && !numbers.includes(value)) numbers.push(value);
            });
            return numbers;
        }

        function findTeamFromVoice(text) {
            const normalized = normalizeVoiceText(text);
            const aliases = [];
            TEAMS.forEach(team => {
                const details = TEAM_DETAILS[team] || { name: team };
                aliases.push({ team, alias: normalizeVoiceText(team) });
                aliases.push({ team, alias: normalizeVoiceText(details.name) });
                if(team === 'FWC') aliases.push({ team, alias: 'fifa' }, { team, alias: 'especiales' }, { team, alias: 'especiales fifa' });
                if(team === 'CC') aliases.push({ team, alias: 'coca cola' }, { team, alias: 'coca' });
                if(team === 'RSA') aliases.push({ team, alias: 'sudafrica' });
                if(team === 'KOR') aliases.push({ team, alias: 'corea' }, { team, alias: 'corea sur' });
                if(team === 'CZE') aliases.push({ team, alias: 'checa' }, { team, alias: 'republica checa' });
                if(team === 'BIH') aliases.push({ team, alias: 'bosnia' });
                if(team === 'SCO') aliases.push({ team, alias: 'escocia' });
                if(team === 'USA') aliases.push({ team, alias: 'estados unidos' }, { team, alias: 'eeuu' });
                if(team === 'NED') aliases.push({ team, alias: 'paises bajos' }, { team, alias: 'holanda' });
                if(team === 'KSA') aliases.push({ team, alias: 'arabia' }, { team, alias: 'arabia saudita' });
                if(team === 'COD') aliases.push({ team, alias: 'congo' }, { team, alias: 'rd congo' });
            });
            aliases.sort((a,b) => b.alias.length - a.alias.length);
            return aliases.find(item => item.alias && normalized.includes(item.alias))?.team || null;
        }

        window.processVoiceCommand = async (spokenText) => {
            if (!state.virtualUser || !state.firebaseUser) return;
            const team = findTeamFromVoice(spokenText);
            if(!team) {
                state.voiceStatus = `No pude reconocer el país en: "${spokenText}"`;
                updateVoiceStatusOnly();
                return;
            }
            const max = getStickerCount(team);
            const numbers = extractVoiceNumbers(spokenText, max);
            if(numbers.length === 0) {
                state.voiceStatus = `Reconocí ${TEAM_DETAILS[team]?.name || team}, pero no encontré números válidos.`;
                updateVoiceStatusOnly();
                return;
            }
            if (!state.albumData) state.albumData = {};
            if (!state.albumData[team]) state.albumData[team] = {};
            const normalized = normalizeVoiceText(spokenText);
            const shouldClear = /(borrar|borra|quitar|quita|sacar|saca|deseleccionar|desmarcar)/.test(normalized);
            const asDuplicate = /(repetida|repetidas|duplicada|duplicadas)/.test(normalized) && !shouldClear;

            numbers.forEach(num => {
                if(shouldClear) delete state.albumData[team][num];
                else if(asDuplicate) state.albumData[team][num] = Math.min(((state.albumData[team][num] || 1) + 1), 4);
                else state.albumData[team][num] = Math.max(state.albumData[team][num] || 0, 1);

                const wrap = document.getElementById(`sticker-wrap-${team}-${num}`);
                if (wrap) wrap.innerHTML = getStickerInnerHtml(team, num);
            });
            if (Object.keys(state.albumData[team] || {}).length === 0) delete state.albumData[team];
            updateGlobalStatsOnly();
            updateTeamCounterOnly(team);
            loadIconsSafely();

            try {
                await saveAlbumData();
                state.voiceStatus = `${shouldClear ? 'Desmarqué' : asDuplicate ? 'Marqué como repetidas' : 'Marqué'} ${TEAM_DETAILS[team]?.name || team}: ${numbers.join(', ')}.`;
            } catch (error) {
                console.error('Error guardando comando por voz', error);
                state.voiceStatus = 'Reconocí el pedido, pero no pude guardarlo. Revisá la conexión.';
            }
            updateVoiceStatusOnly();
        };

        window.startVoiceMarking = () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) {
                state.voiceStatus = 'Tu navegador no permite dictado por voz. Probá desde Chrome.';
                updateVoiceStatusOnly();
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            state.voiceStatus = 'Escuchando... decí algo como: Argentina 1 2 3.';
            updateVoiceStatusOnly();
            recognition.onresult = (event) => {

                state.voiceStatus = `Escuché: "${text}"`;

                window.processVoiceCommand(text);
            };
            recognition.onerror = () => {

        function calculateStats() {
            let collected = 0, duplicates = 0;
            if (state.albumData) {
                Object.values(state.albumData).forEach(teamData => {
                    Object.values(teamData).forEach(st => {
                        if (st >= 1) collected++;
                        if (st > 1) duplicates += (st - 1);
                    });
                });
            }
            return { collected, duplicates, percent: Math.round((collected / TOTAL_STICKERS) * 100) };
        }

        function calculateTeamProgress() {
            return TEAMS.map(team => {
                const count = getStickerCount(team);
                const have = Object.values((state.albumData && state.albumData[team]) || {}).filter(s => s > 0).length;
                return {
                    team,
                    name: TEAM_DETAILS[team]?.name || team,
                    count,
                    have,
                    missing: count - have,
                    percent: Math.round((have / count) * 100)
                };
            });
        }

        function renderProgressRankings() {
            const progress = calculateTeamProgress();

            const farthest = progress.filter(t => t.missing > 0).sort((a,b) => b.missing - a.missing || a.have - b.have || a.name.localeCompare(b.name)).slice(0, 5);

        function getSpecialStickerArt(team, num, isHave, compact = false) {
            const details = TEAM_DETAILS[team] || { code: 'un', colors: ['#4B5563', '#1F2937', '#000000'], name: team };
            const isCountry = details.code !== 'fifa' && details.code !== 'cc';
            if (!isHave || !isCountry) return '';
            const flagUrl = `https://flagcdn.com/w160/${details.code}.png`;
            const [c1, c2, c3] = details.colors;

            if (num === 1) {
                return `
                    <div class="absolute inset-1 rounded-[16px] overflow-hidden pointer-events-none sticker-metal">
                        <div class="absolute inset-0" style="background:linear-gradient(145deg, ${c1}, ${c2} 52%, ${c3});"></div>
                        <div class="absolute inset-0 opacity-45" style="background:radial-gradient(circle at 25% 20%, rgba(255,255,255,0.55), transparent 28%), radial-gradient(circle at 80% 18%, rgba(255,255,255,0.35), transparent 22%), linear-gradient(135deg, transparent 0 25%, rgba(255,255,255,0.14) 25% 35%, transparent 35% 60%, rgba(255,255,255,0.10) 60% 70%, transparent 70% 100%);"></div>
                        <div class="absolute inset-[14%] rounded-[18px] border border-white/40 bg-black/10 backdrop-blur-[2px] flex items-center justify-center shadow-[inset_0_1px_8px_rgba(255,255,255,0.2)]">
                            <div class="w-[58%] aspect-square rounded-full overflow-hidden border-2 border-white/80 shadow-[0_0_14px_rgba(255,255,255,0.35)] bg-white/90 flex items-center justify-center">
                                <img src="${flagUrl}" alt="${details.name}" class="w-full h-full object-cover" />
                            </div>
                        </div>
                    </div>`;
            }

            if (num === 13) {
                return `
                    <div class="absolute inset-1 rounded-[16px] overflow-hidden pointer-events-none">
                        <div class="absolute inset-0" style="background:linear-gradient(155deg, ${c3}, ${c1} 55%, ${c2});"></div>
                        <div class="absolute inset-0 opacity-35" style="background:radial-gradient(circle at 20% 18%, rgba(255,255,255,0.35), transparent 28%), linear-gradient(135deg, transparent 0 30%, rgba(255,255,255,0.12) 30% 40%, transparent 40% 100%);"></div>
                        <div class="absolute inset-x-[8%] inset-y-[16%] rounded-2xl border border-white/25 bg-black/10 backdrop-blur-[2px] flex items-center justify-center gap-2 sm:gap-3">
                            ${buildJerseyHtml(c1, c2, c3, compact)}
                            ${buildJerseyHtml(c2, c1, c3, compact)}
                            ${buildJerseyHtml(c3, c2, c1, compact)}
                        </div>
                    </div>`;
            }
            return '';
        }

        function getRepeatBadgeHtml(reps, compact = false) {
            if (reps <= 0) return '';
            const size = compact ? 'text-[9px] px-2 py-[3px] top-1.5' : 'text-[10px] sm:text-xs px-2.5 py-1 top-2';
            return `<div class="absolute left-1/2 -translate-x-1/2 ${size} rounded-full repeat-pill text-white font-black border border-white/55 z-20 pointer-events-none tracking-wide">REP +${reps}</div>`;
        }

        function getMyDuplicates() {
            const dups = [];
            if (state.albumData) {
                Object.entries(state.albumData).forEach(([team, stickers]) => {
                    Object.entries(stickers).forEach(([numStr, st]) => {
                        if (st > 1) dups.push({ team, num: parseInt(numStr), reps: st - 1 });
                    });
                });
            }
            return dups;
        }

        // --- RENDERIZADORES DE HTML ---
        
        // Componente 100% visual para dibujar cualquier figurita en mercado y notificaciones
        window.getStaticStickerHTML = (team, num, stateCode, onClickAttr = '', customClasses = 'w-16', isSelected = false) => {
            const details = TEAM_DETAILS[team] || { code: 'un', colors: ['#4B5563', '#1F2937', '#000000'] };
            const isMissing = stateCode === 0;
            const isHave = stateCode >= 1;
            const reps = stateCode > 1 ? stateCode - 1 : 0;
            const bgColor = isHave ? details.colors[0] : '';
            const isWide = num === 13 && details.code !== 'fifa' && details.code !== 'cc';
            const specialArt = getSpecialStickerArt(team, num, isHave, true);

            const maskColorsHtml = (!specialArt && isHave) ? `
                <div class="absolute inset-0 transition-all duration-300 opacity-90 pointer-events-none"
                     style="background: radial-gradient(ellipse at 50% 50%, ${details.colors[2]} 0%, ${details.colors[2]} 30%, ${details.colors[1]} 31%, ${details.colors[1]} 100%);
                            mask-image: url('${LOGO_URL}'); -webkit-mask-image: url('${LOGO_URL}');
                            mask-size: 85%; -webkit-mask-size: 85%; mask-position: center; -webkit-mask-position: center; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat;">
                </div>
            ` : (!specialArt ? `
                <div class="absolute inset-0 mix-blend-overlay opacity-30 pointer-events-none"
                     style="background-image: url('${LOGO_URL}'); background-size: 85%; background-position: center; background-repeat: no-repeat; filter: grayscale(100%) brightness(200%);">
                </div>
            ` : '');

            let iconBadge = '';
            if(isHave && details.code !== 'fifa' && details.code !== 'cc') {
                iconBadge = `<div class="absolute bottom-[2px] right-[2px] w-[30%] h-[30%] rounded-full overflow-hidden border border-white shadow-md z-10 bg-white flex items-center justify-center pointer-events-none"><img src="https://flagcdn.com/w40/${details.code}.png" class="w-full h-full object-cover pointer-events-none" /></div>`;
            } else if (isHave && details.code === 'fifa') {
                iconBadge = `<div class="absolute bottom-[2px] right-[2px] w-[30%] h-[30%] rounded-full overflow-hidden border border-white shadow-md z-10 bg-yellow-400 flex items-center justify-center text-[10px] sm:text-xs pointer-events-none">🏆</div>`;
            } else if (isHave && details.code === 'cc') {
                iconBadge = `<div class="absolute bottom-[2px] right-[2px] w-[30%] h-[30%] rounded-full overflow-hidden border border-white shadow-md z-10 bg-red-600 flex items-center justify-center text-[10px] sm:text-xs pointer-events-none">🥤</div>`;
            }

            const borderClass = isSelected ? 'border-[3px] border-green-400 shadow-[0_0_15px_rgba(74,222,128,0.8)] scale-105' : (isMissing ? 'border border-white/20' : `border-[2px] border-white/90 shadow-md ${reps > 0 ? 'ring-2 ring-sky-300/50' : ''}`);
            const overlay = isSelected ? `<div class="absolute inset-0 bg-green-400/20 z-20 pointer-events-none rounded-lg"></div><div class="absolute -top-2 -right-2 bg-green-500 text-white rounded-full p-1 z-30 shadow-lg"><i data-lucide="check" class="w-3 h-3"></i></div>` : '';

            return `
                <div class="relative flex justify-center ${customClasses}">
                    <button type="button" ${onClickAttr ? `onclick="${onClickAttr}"` : ''} 
                            class="relative w-full ${isWide ? 'aspect-[7/4]' : 'aspect-[3/4]'} rounded-xl flex items-center justify-center transition-all duration-300 select-none outline-none ${onClickAttr ? 'cursor-pointer touch-manipulation active:scale-95' : 'cursor-default'} ${borderClass} ${isMissing ? 'bg-white/10' : ''}"
                            style="background-color: ${bgColor}">
                        <div class="absolute inset-0 rounded-xl overflow-hidden pointer-events-none">
                            ${maskColorsHtml}
                            ${specialArt}
                        </div>
                        ${getRepeatBadgeHtml(reps, true)}
                        <div class="absolute bottom-[2px] left-[2px] w-[30%] h-[30%] rounded-full flex items-center justify-center font-black text-xs shadow-md transition-all z-10 pointer-events-none ${isMissing ? 'bg-black/20 text-white/50 backdrop-blur-sm' : 'bg-white text-gray-900'}">${num}</div>
                        ${iconBadge}
                        ${overlay}
                    </button>
                </div>
            `;
        }

        function getStickerInnerHtml(team, num) {
            const details = TEAM_DETAILS[team] || { code: 'un', colors: ['#4B5563', '#1F2937', '#000000'] };
            const st = (state.albumData && state.albumData[team] && state.albumData[team][num]) || 0;
            const isMissing = st === 0;
            const isHave = st >= 1;
            const reps = st > 1 ? st - 1 : 0;
            const bgColor = isHave ? details.colors[0] : '';
            const isWide = num === 13 && details.code !== 'fifa' && details.code !== 'cc';
            const specialArt = getSpecialStickerArt(team, num, isHave, false);

            const maskColorsHtml = (!specialArt && isHave) ? `
                <div class="absolute inset-0 transition-all duration-300 opacity-90 pointer-events-none"
                     style="background: radial-gradient(ellipse at 50% 50%, ${details.colors[2]} 0%, ${details.colors[2]} 30%, ${details.colors[1]} 31%, ${details.colors[1]} 100%);
                            mask-image: url('${LOGO_URL}'); -webkit-mask-image: url('${LOGO_URL}');
                            mask-size: 85%; -webkit-mask-size: 85%;
                            mask-position: center; -webkit-mask-position: center;
                            mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat;">
                </div>
            ` : (!specialArt ? `
                <div class="absolute inset-0 mix-blend-overlay opacity-30 pointer-events-none"
                     style="background-image: url('${LOGO_URL}'); background-size: 85%; background-position: center; background-repeat: no-repeat; filter: grayscale(100%) brightness(200%);">
                </div>
            ` : '');

            let iconBadge = '';
            if(isHave && details.code !== 'fifa' && details.code !== 'cc') {
                iconBadge = `<div class="absolute bottom-1 right-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full overflow-hidden border-2 border-white shadow-md z-10 bg-white flex items-center justify-center pointer-events-none"><img src="https://flagcdn.com/w40/${details.code}.png" class="w-full h-full object-cover pointer-events-none" /></div>`;
            } else if (isHave && details.code === 'fifa') {
                iconBadge = `<div class="absolute bottom-1 right-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full overflow-hidden border-2 border-white shadow-md z-10 bg-yellow-400 flex items-center justify-center text-xs pointer-events-none">🏆</div>`;
            } else if (isHave && details.code === 'cc') {
                iconBadge = `<div class="absolute bottom-1 right-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full overflow-hidden border-2 border-white shadow-md z-10 bg-red-600 flex items-center justify-center text-xs pointer-events-none">🥤</div>`;
            }

            return `
                <button type="button" onclick="window.toggleSticker('${team}', ${num})" 
                        class="relative w-full ${isWide ? 'aspect-[7/4] max-w-none' : 'aspect-[3/4] max-w-[80px]'} rounded-xl flex items-center justify-center transition-all duration-300 select-none outline-none touch-manipulation cursor-pointer active:scale-95 ${isMissing ? 'bg-white/10 border border-white/20 active:bg-white/20 shadow-inner' : `border-[2px] sm:border-[3px] border-white/90 shadow-[0_8px_15px_rgba(0,0,0,0.3)] sm:hover:-translate-y-1 sm:hover:scale-105 ${reps > 0 ? 'ring-2 ring-sky-300/55' : ''}`}"
                        style="background-color: ${bgColor}">
                    <div class="absolute inset-0 rounded-xl overflow-hidden pointer-events-none">
                        ${maskColorsHtml}
                        ${specialArt}
                    </div>
                    ${getRepeatBadgeHtml(reps, false)}
                    <div class="absolute bottom-1 left-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center font-black text-xs sm:text-sm shadow-md transition-all z-10 pointer-events-none ${isMissing ? 'bg-black/20 text-white/50 backdrop-blur-sm' : 'bg-white text-gray-900'}">${num}</div>
                    ${iconBadge}
                </button>
                ${isHave ? `<button type="button" onclick="return window.clearSticker('${team}', ${num}, event)" title="Deseleccionar figurita" aria-label="Deseleccionar figurita" class="absolute -top-1.5 -right-1.5 bg-red-500 hover:bg-red-600 text-white w-4 h-4 sm:w-5 sm:h-5 rounded-full flex items-center justify-center border border-white shadow-lg z-30 active:scale-90 transition-all"><i data-lucide="x" class="w-2.5 h-2.5 sm:w-3 sm:h-3 pointer-events-none"></i></button>` : ''}
            `;
        }

        // Dropdown menu alfabético
        function renderDropdownNavbar() {
            const sortedTeams = [...TEAMS].sort((a,b) => (TEAM_DETAILS[a]?.name || a).localeCompare((TEAM_DETAILS[b]?.name || b)));
            const options = sortedTeams.map(t => `<option value="${t}" class="bg-gray-800">${TEAM_DETAILS[t].name}</option>`).join('');
            return `
            <div class="bg-black/20 backdrop-blur-sm p-4 rounded-2xl border border-white/10 mb-6 shadow-md fade-in flex flex-col sm:flex-row items-center gap-3">
                <div class="text-xs text-white/60 uppercase tracking-widest font-bold flex items-center gap-2 whitespace-nowrap">
                    <i data-lucide="navigation" class="w-4 h-4 pointer-events-none"></i> Búsqueda Rápida:
                </div>
                <div class="relative w-full">
                    <select onchange="window.scrollToTeam(this.value); this.value='';" class="w-full bg-black/40 border border-white/20 text-white font-bold rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-green-400 cursor-pointer text-sm appearance-none">
                        <option value="" disabled selected>Selecciona un país del índice alfabético...</option>
                        ${options}
                    </select>
                    <i data-lucide="chevron-down" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white/50 pointer-events-none w-4 h-4"></i>
                </div>
            </div>
            `;
        }

        function renderAlbum() {
            const stats = calculateStats();
            
            const teamsHtml = TEAMS.map(team => {
                const details = TEAM_DETAILS[team] || { name: team, code: 'un', colors: ['#4B5563', '#1F2937', '#000000'] };
                const count = getStickerCount(team);
                const haveCount = Object.values(state.albumData[team] || {}).filter(s => s > 0).length;
                const isComplete = haveCount === count;
                
                let flagHtml = details.code === 'fifa' ? `<div class="w-8 h-6 sm:w-10 sm:h-7 bg-yellow-500/20 rounded flex items-center justify-center text-yellow-400 border border-yellow-500/50">🏆</div>` : 
                               details.code === 'cc' ? `<div class="w-8 h-6 sm:w-10 sm:h-7 bg-red-500/20 rounded flex items-center justify-center text-red-400 border border-red-500/50">🥤</div>` : 
                               `<img src="https://flagcdn.com/w40/${details.code}.png" alt="${details.name}" class="w-8 sm:w-10 rounded shadow-sm object-cover pointer-events-none" />`;

                let stickersHtml = Array.from({ length: count }).map((_, idx) => {
                    const num = idx + 1;
                    const wrapClass = num === 13 && details.code !== 'fifa' && details.code !== 'cc' ? 'relative flex justify-center col-span-2' : 'relative flex justify-center';
                    return `<div id="sticker-wrap-${team}-${num}" class="${wrapClass}">${getStickerInnerHtml(team, num)}</div>`;
                }).join('');

                return `
                <div id="team-section-${team}" class="bg-black/20 backdrop-blur-xl rounded-3xl overflow-hidden border border-white/20 shadow-xl scroll-smooth-offset">
                    <div class="bg-gradient-to-r from-black/60 to-black/20 px-4 py-3 sm:px-5 sm:py-3 border-b border-white/10 backdrop-blur-md">
                        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                            <span class="font-bold text-base sm:text-lg tracking-wide flex items-center gap-3">
                                ${flagHtml} ${details.name}
                            </span>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                                <button id="team-complete-btn-${team}" type="button" onclick="window.markWholeTeam('${team}')" ${isComplete ? 'disabled' : ''} class="${isComplete ? 'flex items-center justify-center gap-1.5 text-[10px] sm:text-xs bg-green-500/25 text-green-200 border border-green-400/40 px-3 py-1.5 rounded-full font-bold shadow-sm whitespace-nowrap cursor-default' : 'flex items-center justify-center gap-1.5 text-[10px] sm:text-xs bg-white/15 hover:bg-green-500/30 text-white border border-white/25 hover:border-green-400/60 px-3 py-1.5 rounded-full font-bold shadow-sm whitespace-nowrap active:scale-95 transition-all cursor-pointer touch-manipulation'}">
                                    ${isComplete ? '<i data-lucide="check-circle-2" class="w-4 h-4 pointer-events-none"></i> Completo' : '<i data-lucide="check-square" class="w-4 h-4 pointer-events-none"></i> Marcar todas'}
                                </button>
                                <span id="team-count-${team}" class="text-xs bg-white/20 backdrop-blur-md border border-white/30 px-3 py-1.5 rounded-full font-bold shadow-sm whitespace-nowrap ml-2">
                                    ${haveCount} / ${count}
                                </span>
                            </div>
                        </div>
                        <div class="mt-3">
                            <div class="flex items-center justify-between text-[11px] text-white/60 mb-1.5">
                                <span id="team-progress-text-${team}">${Math.round((haveCount / count) * 100)}% completo</span>
                                <span>${count - haveCount} faltan</span>
                            </div>
                            <div class="team-progress-track w-full h-2 rounded-full overflow-hidden">
                                <div id="team-progress-${team}" class="team-progress-fill bg-gradient-to-r from-emerald-400 to-lime-300 h-full rounded-full transition-all duration-700" style="width: ${Math.round((haveCount / count) * 100)}%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="p-3 sm:p-5 grid grid-cols-4 sm:grid-cols-5 md:grid-cols-10 gap-x-2 gap-y-4 sm:gap-4 pt-6">
                        ${stickersHtml}
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="space-y-6">
                <!-- Estadísticas y Botones de Acción -->
                <div class="bg-black/20 backdrop-blur-xl rounded-2xl p-5 border border-white/20 shadow-lg flex flex-col fade-in">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-white/90 text-lg uppercase tracking-wide">Tu Progreso</h3>
                        <span id="stat-percent" class="text-green-400 font-extrabold text-2xl drop-shadow-md">${stats.percent}%</span>
                    </div>
                    <div class="w-full bg-black/40 rounded-full h-3 mb-5 border border-white/10 overflow-hidden shadow-inner">
                        <div id="stat-bar" class="bg-gradient-to-r from-green-400 to-green-300 h-full rounded-full transition-all duration-1000 shadow-[0_0_10px_rgba(74,222,128,0.5)]" style="width: ${stats.percent}%"></div>
                    </div>
                    
                    <div class="flex flex-wrap items-center justify-between gap-3 text-sm mb-4">
                        <div class="flex flex-col items-center bg-white/5 px-2 py-2 rounded-xl border border-white/10 flex-1 min-w-[30%] sm:min-w-[80px]">
                            <span class="text-white/60 text-[10px] sm:text-xs uppercase mb-1 text-center">Obtenidas</span>
                            <span id="stat-collected" class="font-bold text-base sm:text-lg leading-none">${stats.collected} <span class="text-white/40 text-xs sm:text-sm">/ ${TOTAL_STICKERS}</span></span>
                        </div>
                        <div class="flex flex-col items-center bg-white/5 px-2 py-2 rounded-xl border border-white/10 flex-1 min-w-[30%] sm:min-w-[80px]">
                            <span class="text-white/60 text-[10px] sm:text-xs uppercase mb-1 text-center">Faltantes</span>
                            <span id="stat-missing" class="font-bold text-base sm:text-lg leading-none">${TOTAL_STICKERS - stats.collected}</span>
                        </div>
                        <div class="flex flex-col items-center bg-blue-500/10 px-2 py-2 rounded-xl border border-blue-400/30 flex-1 min-w-[30%] sm:min-w-[80px]">
                            <span class="text-blue-300 text-[10px] sm:text-xs uppercase mb-1 text-center">Repetidas</span>
                            <span id="stat-duplicates" class="font-bold text-base sm:text-lg text-blue-300 leading-none">${stats.duplicates}</span>
                        </div>
                    </div>

                    <div id="progress-rankings" class="mb-4">
                        ${renderProgressRankings()}
                    </div>

                    <!-- NUEVA BARRA DE ACCIONES (Imprimir / Cambio Manual / Borrar) -->
                    <div class="w-full mt-2 flex flex-wrap sm:flex-nowrap justify-end gap-2 border-t border-white/10 pt-4">
                        <button type="button" onclick="window.openPrintModal()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-indigo-500/20 hover:bg-indigo-500/40 text-indigo-300 border border-indigo-500/40 px-3 py-2.5 rounded-xl transition-all text-[11px] sm:text-xs uppercase font-bold backdrop-blur-md active:scale-95 cursor-pointer touch-manipulation">
                            <i data-lucide="download" class="w-4 h-4 pointer-events-none"></i> Descargar
                        </button>
                        <button type="button" onclick="window.openManualTradeModal()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-300 border border-emerald-500/40 px-3 py-2.5 rounded-xl transition-all text-[11px] sm:text-xs uppercase font-bold backdrop-blur-md active:scale-95 cursor-pointer touch-manipulation">
                            <i data-lucide="refresh-cw" class="w-4 h-4 pointer-events-none"></i> Cambios
                        </button>
                        <button type="button" onclick="window.setShowClearConfirm(true)" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-red-500/10 hover:bg-red-500/30 text-red-300 border border-red-500/40 px-3 py-2.5 rounded-xl transition-all text-[11px] sm:text-xs uppercase font-bold backdrop-blur-md active:scale-95 cursor-pointer touch-manipulation">
                            <i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i> Borrar
                        </button>
                    </div>
                </div>

                <!-- Banderas Alfabéticas -->
                ${renderDropdownNavbar()}

                <!-- MODO SOLO REPETIDAS -->
                <div class="flex items-center justify-between bg-black/30 p-4 rounded-2xl border ${state.isRepetidasMode ? 'border-green-400 shadow-[0_0_15px_rgba(74,222,128,0.3)]' : 'border-white/10'} mb-6 fade-in transition-all">
                    <div class="flex flex-col">
                        <span class="text-base font-bold text-white tracking-wide">SOLO TILDAR REPETIDAS</span>
                        <span class="text-xs text-white/50">Toca figuritas para sumar repetidas directamente</span>
                    </div>
                    <label class="flex items-center cursor-pointer touch-manipulation">
                        <div class="relative">
                            <input type="checkbox" class="sr-only toggle-checkbox" onchange="window.toggleRepetidasMode()" ${state.isRepetidasMode ? 'checked' : ''}>
                            <div class="block bg-white/20 w-14 h-8 rounded-full border border-white/30 transition-all toggle-label"></div>
                            <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition-transform"></div>
                        </div>
                    </label>
                </div>

                <!-- Equipos (Sin re-renderizados) -->
                <div class="space-y-8 fade-in">
                    ${teamsHtml}
                </div>
            </div>`;
        }

        function getMarketData() {
            const otherUsers = state.allUsersData.filter(u => u.id !== state.virtualUser.id);
            return otherUsers.map(user => {
                let usefulCount = 0;
                const userDuplicates = []; 
                if (user.album) {
                    Object.entries(user.album).forEach(([team, stickers]) => {
                        Object.entries(stickers).forEach(([numStr, st]) => {
                            if (st > 1) {
                                const num = parseInt(numStr);
                                userDuplicates.push({ team, num, reps: st - 1 });
                                const myState = (state.albumData && state.albumData[team] && state.albumData[team][num]) || 0;
                                if (myState === 0) usefulCount++;
                            }
                        });
                    });
                }
                return { ...user, duplicates: userDuplicates, usefulCount };
            }).sort((a, b) => b.usefulCount - a.usefulCount);
        }

        function renderMarket() {
            const marketData = getMarketData();
            
            if (state.selectedMarketUser) {
                const userMatches = marketData.find(u => u.id === state.selectedMarketUser);
                let dupHtml = userMatches.duplicates.map(dup => {
                    const myState = (state.albumData && state.albumData[dup.team] && state.albumData[dup.team][dup.num]) || 0;
                    const iNeedIt = myState === 0;
                    const stickerVisual = window.getStaticStickerHTML(dup.team, dup.num, 2, '', 'w-14 sm:w-16');

                    return `
                    <div class="flex items-center gap-4 p-3 rounded-2xl border backdrop-blur-md transition-all ${iNeedIt ? 'bg-green-400/20 border-green-400 shadow-[0_0_15px_rgba(74,222,128,0.2)]' : 'bg-white/5 border-white/10 opacity-70'}">
                        ${stickerVisual}
                        <div class="flex flex-col">
                            <span class="font-bold text-lg">${TEAM_DETAILS[dup.team]?.name || dup.team}</span>
