<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planilla de figuritas Mundial 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Animaciones personalizadas */
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Ajuste de scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }
        
        .scroll-smooth-offset { scroll-margin-top: 130px; }
        
        /* Toggle Switch para repetidas */
        .toggle-checkbox:checked { right: 0; border-color: #4ade80; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4ade80; }
        .toggle-checkbox:checked + .toggle-label:before { transform: translateX(100%); }
    </style>
</head>

            'ALG': { name: 'Argelia', code: 'dz', colors: ['#006233', '#FFFFFF', '#D21034'] },
            'AUT': { name: 'Austria', code: 'at', colors: ['#ED2939', '#FFFFFF', '#990000'] },
            'JOR': { name: 'Jordania', code: 'jo', colors: ['#CE1126', '#FFFFFF', '#007A3D'] },
            'POR': { name: 'Portugal', code: 'pt', colors: ['#FF0000', '#006600', '#FFCE00'] },
            'COD': { name: 'R.D. Congo', code: 'cd', colors: ['#007FFF', '#FCD116', '#CE1021'] },
            'UZB': { name: 'Uzbekistán', code: 'uz', colors: ['#0099B5', '#FFFFFF', '#1EB53A'] },
            'COL': { name: 'Colombia', code: 'co', colors: ['#FCD116', '#003893', '#CE1126'] },
            'ENG': { name: 'Inglaterra', code: 'gb-eng', colors: ['#FFFFFF', '#CE1124', '#002868'] },
            'CRO': { name: 'Croacia', code: 'hr', colors: ['#FF0000', '#FFFFFF', '#171796'] },
            'GHA': { name: 'Ghana', code: 'gh', colors: ['#CE1126', '#FCD116', '#006B3F'] },
            'PAN': { name: 'Panamá', code: 'pa', colors: ['#DA291C', '#FFFFFF', '#0033A0'] },
            'CC': { name: 'Coca-Cola', code: 'cc', colors: ['#E3000F', '#FFFFFF', '#000000'] }
        };

        // --- ESTADO GLOBAL ---
        const state = {
            firebaseUser: null,
            isFirebaseReady: false,
            virtualUser: null, // {id, fullName}
            albumData: {},
            allUsersData: [],
            tradesData: [], // Almacena notificaciones e intercambios
            currentTab: 'album', // 'album', 'market', 'trade', 'notifications'
            loading: true,
            dbError: '',
            isNewUserMode: false,
            showClearConfirm: false,
            isRepetidasMode: false, // MODO: SOLO TILDAR REPETIDAS
            selectedMarketUser: null,
            tradeDraft: null // { toUser, request: [], offer: [] }
        };

        // Función segura para cargar iconos
        function loadIconsSafely() {
            if (typeof window.lucide !== 'undefined') {
                window.lucide.createIcons();
            }
        }

        // --- INICIALIZACIÓN ---
        async function init() {
            render();

            setTimeout(() => {
                if (state.loading) {
                    state.loading = false;
                    if(state.firebaseUser) render();
                    else {
                       state.dbError = "La conexión con la base de datos está tardando demasiado.";
                       render();
                    }
                }
            }, 3000);

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); } 
                    catch (e) { await signInAnonymously(auth); }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) { console.error("Auth error:", error); }

            onAuthStateChanged(auth, (user) => {
                state.firebaseUser = user;
                state.isFirebaseReady = true;
                if (!user) {
                    state.loading = false;
                    render();
                } else {
                    listenToDatabase();
                }
            });
        }

        function listenToDatabase() {
            const usersRef = collection(db, 'artifacts', projectId, 'public', 'data', 'sticker_users');
            onSnapshot(usersRef, (snapshot) => {
                const users = [];
                snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
                state.allUsersData = users;
                
                state.loading = false; 
                state.dbError = '';
                
                if (state.virtualUser) {
                    const myData = users.find(u => u.id === state.virtualUser.id);
                    if (myData && myData.album) {
                        state.albumData = myData.album;
                    }
                }
                
                if(state.allUsersData.length === 0) state.isNewUserMode = true;
                
                if (state.currentTab !== 'album') render(); 
                else if(document.getElementById('stat-percent')) updateGlobalStatsOnly(); 
                else render();
                
            }, (error) => {
                state.dbError = "Permiso denegado al leer la base de datos de Firebase.";
                state.loading = false;
                render();
            });

            // Escuchar intercambios (Notificaciones)
            const tradesRef = collection(db, 'artifacts', projectId, 'public', 'data', 'sticker_trades');
            onSnapshot(tradesRef, (snapshot) => {
                const trades = [];
                snapshot.forEach(doc => trades.push({ id: doc.id, ...doc.data() }));
                state.tradesData = trades;
                // Forzar renderizado de la campanita y pantalla de notificaciones
                if (state.virtualUser) render(); 
            });
        }

        // --- LÓGICA DE NEGOCIO ---
        window.handleLoginSubmit = async (event) => {
            event.preventDefault();
            if (!state.firebaseUser) return alert("⚠️ No hay conexión con Firebase.");
            
            const name = document.getElementById('loginName')?.value || '';
            const pin = document.getElementById('loginPin').value;
            let userId = '';
            let fullName = '';

            if (state.isNewUserMode) {
                fullName = name;
                userId = fullName.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
            } else {
                const selectElement = document.getElementById('loginSelect');
                userId = selectElement.value;
                const found = state.allUsersData.find(u => u.id === userId);
                if(found) fullName = found.fullName;
            }

            if (!userId || pin.length !== 4) return alert("Verifica los datos ingresados.");

            state.loading = true; render();

            try {
                const userRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_users', userId);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    if (data.pin === pin) {
                        state.virtualUser = { id: userId, fullName: data.fullName };
                        state.albumData = data.album || {};
                    } else alert("PIN incorrecto.");
                } else {
                    if (!state.isNewUserMode) alert("El usuario ya no existe.");
                    else {
                        const newUser = { fullName, pin, album: {}, createdAt: new Date().toISOString() };
                        await setDoc(userRef, newUser);
                        state.virtualUser = { id: userId, fullName };
                        state.albumData = {};
                    }
                }
            } catch (error) { state.dbError = "Error guardando datos: " + error.message; }
            state.loading = false; render();
        };

        window.handleLogout = () => {
            state.virtualUser = null;
            state.albumData = {};
            state.currentTab = 'album';
            render();
        };

        window.toggleRepetidasMode = () => {
            state.isRepetidasMode = !state.isRepetidasMode;
            render(); // Re-render para actualizar el botón de toggle
        };

        // Función de toggle figurita en Mi Álbum
        window.toggleSticker = async (team, number) => {
            if (!state.virtualUser || !state.firebaseUser) return;
            if (!state.albumData) state.albumData = {};
            if (!state.albumData[team]) state.albumData[team] = {};
            
            const currentState = state.albumData[team][number] || 0;
            let nextState;

            // MODO SOLO TILDAR REPETIDAS
            if (state.isRepetidasMode) {
                if (currentState === 0 || currentState === 1) nextState = 2; // Pasa a tener 1 repetida (+1)
                else if (currentState >= 2 && currentState < 4) nextState = currentState + 1; // Suma otra repetida
                else nextState = 1; // Resetea a "solo la tengo", borra las repetidas
            } else {
                nextState = (currentState + 1) % 5;
            }
            
            if (nextState === 0) {
                delete state.albumData[team][number]; 
            } else {
                state.albumData[team][number] = nextState;
            }

            const wrap = document.getElementById(`sticker-wrap-${team}-${number}`);
            if(wrap) wrap.innerHTML = getStickerInnerHtml(team, number);
            
            updateGlobalStatsOnly();
            updateTeamCounterOnly(team);

            try {
                const userRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_users', state.virtualUser.id);
                await setDoc(userRef, { album: state.albumData }, { merge: true });
            } catch (error) { console.error("Error guardando figurita", error); }
        };

        window.handleClearAlbum = async () => {
            if (!state.virtualUser || !state.firebaseUser) return;
            try {
                const userRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_users', state.virtualUser.id);
                await setDoc(userRef, { album: {} }, { merge: true });
                state.albumData = {}; 
                state.showClearConfirm = false;
                render(); 
            } catch (error) { console.error(error); }
        };

        // --- SISTEMA DE INTERCAMBIOS ---
        window.openTradeDraft = (userId) => {
            const user = state.allUsersData.find(u => u.id === userId);
            state.tradeDraft = {
                toUser: user,
                request: [], // lo que quiero
                offer: []    // lo que le doy
            };
            window.setTab('trade');
        };

        window.toggleTradeItem = (type, team, num) => {
            const list = state.tradeDraft[type];
            const idx = list.findIndex(i => i.team === team && i.num === num);
            if (idx >= 0) list.splice(idx, 1);
            else list.push({team, num});
            render(); // Re-render draft
        };

        window.sendTradeProposal = async () => {
            if(state.tradeDraft.request.length === 0 && state.tradeDraft.offer.length === 0) return;
            state.loading = true; render();
            try {
                const tradesRef = collection(db, 'artifacts', projectId, 'public', 'data', 'sticker_trades');
                const newDocRef = doc(tradesRef);
                await setDoc(newDocRef, {
                    fromId: state.virtualUser.id,
                    fromName: state.virtualUser.fullName,
                    toId: state.tradeDraft.toUser.id,
                    toName: state.tradeDraft.toUser.fullName,
                    request: state.tradeDraft.request,
                    offer: state.tradeDraft.offer,
                    status: 'pending',
                    timestamp: new Date().toISOString()
                });
                state.tradeDraft = null;
                window.setTab('market');
            } catch(e) { console.error(e); }
            state.loading = false; render();
        };

        window.respondTrade = async (tradeId, action) => {
            state.loading = true; render();
            try {
                const tradeRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_trades', tradeId);
                const trade = state.tradesData.find(t => t.id === tradeId);
                
                if (action === 'rejected') {
                    await setDoc(tradeRef, { status: 'rejected' }, { merge: true });
                } else if (action === 'accepted') {
                    // 1. Marcar como aceptado
                    await setDoc(tradeRef, { status: 'accepted' }, { merge: true });
                    
                    // 2. Modificar MI álbum (Yo soy toId)
                    const myAlbum = JSON.parse(JSON.stringify(state.albumData));
                    trade.offer.forEach(item => { // Gano las que me ofrece
                        if(!myAlbum[item.team]) myAlbum[item.team] = {};
                        const st = myAlbum[item.team][item.num] || 0;
                        if(st === 0) myAlbum[item.team][item.num] = 1;
                        else myAlbum[item.team][item.num] = st + 1;
                    });
                    trade.request.forEach(item => { // Pierdo repetidas que me pidió
                        if(myAlbum[item.team] && myAlbum[item.team][item.num] > 1) {
                            myAlbum[item.team][item.num] -= 1;
                        }
                    });
                    
                    const myRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_users', state.virtualUser.id);
                    await setDoc(myRef, { album: myAlbum }, { merge: true });
                    state.albumData = myAlbum;

                    // 3. Modificar EL álbum DEL OTRO (Él es fromId)
                    const theirRef = doc(db, 'artifacts', projectId, 'public', 'data', 'sticker_users', trade.fromId);
                    const theirSnap = await getDoc(theirRef);
                    if(theirSnap.exists()) {
                        const theirData = theirSnap.data();
                        const theirAlbum = theirData.album || {};
                        trade.request.forEach(item => { // Él Gana mis figuritas
                            if(!theirAlbum[item.team]) theirAlbum[item.team] = {};
                            const st = theirAlbum[item.team][item.num] || 0;
                            if(st === 0) theirAlbum[item.team][item.num] = 1;
                            else theirAlbum[item.team][item.num] = st + 1;
                        });
                        trade.offer.forEach(item => { // Él Pierde las que me dio
                            if(theirAlbum[item.team] && theirAlbum[item.team][item.num] > 1) {
                                theirAlbum[item.team][item.num] -= 1;
                            }
                        });
                        await setDoc(theirRef, { album: theirAlbum }, { merge: true });
                    }
                }
            } catch(e) { console.error(e); }
            state.loading = false; render();
        };

        // --- NAVEGACIÓN ---
        window.scrollToTeam = (team) => {
            if(!team) return;
            const el = document.getElementById(`team-section-${team}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        window.setTab = (tab) => { state.currentTab = tab; render(); };
        window.setNewUserMode = (isNew) => { state.isNewUserMode = isNew; render(); };
        window.setShowClearConfirm = (val) => { state.showClearConfirm = val; renderModalOnly(); };
        window.setSelectedMarketUser = (id) => { state.selectedMarketUser = id; render(); };

        // --- ACTUALIZADORES DIRECTOS ---
        function updateGlobalStatsOnly() {
            const stats = calculateStats();
            const elPercent = document.getElementById('stat-percent');
            const elBar = document.getElementById('stat-bar');
            const elCol = document.getElementById('stat-collected');
            const elMis = document.getElementById('stat-missing');
            const elDup = document.getElementById('stat-duplicates');

            if(elPercent) elPercent.innerText = `${stats.percent}%`;
            if(elBar) elBar.style.width = `${stats.percent}%`;
            if(elCol) elCol.innerHTML = `${stats.collected} <span class="text-white/40 text-xs sm:text-sm">/ ${TOTAL_STICKERS}</span>`;
            if(elMis) elMis.innerText = TOTAL_STICKERS - stats.collected;
            if(elDup) elDup.innerText = stats.duplicates;
        }

        function updateTeamCounterOnly(team) {
            const elCount = document.getElementById(`team-count-${team}`);
            if(elCount) {
                const count = getStickerCount(team);
                const haveCount = Object.values(state.albumData[team] || {}).filter(s => s > 0).length;
                elCount.innerText = `${haveCount} / ${count}`;
            }
        }

        function calculateStats() {
            let collected = 0, duplicates = 0;
            if (state.albumData) {
                Object.values(state.albumData).forEach(teamData => {
                    Object.values(teamData).forEach(st => {
                        if (st >= 1) collected++;
                        if (st > 1) duplicates += (st - 1);
                    });
                });
            }
            return { collected, duplicates, percent: Math.round((collected / TOTAL_STICKERS) * 100) };
        }

        function getMyDuplicates() {
            const dups = [];
            if (state.albumData) {
                Object.entries(state.albumData).forEach(([team, stickers]) => {
                    Object.entries(stickers).forEach(([numStr, st]) => {
                        if (st > 1) dups.push({ team, num: parseInt(numStr), reps: st - 1 });
                    });
                });
            }
            return dups;
        }

        // --- RENDERIZADORES DE HTML ---
        
        // Componente 100% visual para dibujar cualquier figurita en mercado y notificaciones
        window.getStaticStickerHTML = (team, num, stateCode, onClickAttr = '', customClasses = 'w-16', isSelected = false) => {
            const details = TEAM_DETAILS[team] || { code: 'un', colors: ['#4B5563', '#1F2937', '#000000'] };
            const isMissing = stateCode === 0;
            const isHave = stateCode >= 1;
            const reps = stateCode > 1 ? stateCode - 1 : 0;
            const bgColor = isHave ? details.colors[0] : '';
            
            const maskColorsHtml = isHave ? `
                <div class="absolute inset-0 transition-all duration-300 opacity-90 pointer-events-none"
                     style="background: radial-gradient(ellipse at 50% 50%, ${details.colors[2]} 0%, ${details.colors[2]} 30%, ${details.colors[1]} 31%, ${details.colors[1]} 100%);
                            mask-image: url('${LOGO_URL}'); -webkit-mask-image: url('${LOGO_URL}');
                            mask-size: 85%; -webkit-mask-size: 85%; mask-position: center; -webkit-mask-position: center; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat;">
                </div>
            ` : `
                <div class="absolute inset-0 mix-blend-overlay opacity-30 pointer-events-none"
                     style="background-image: url('${LOGO_URL}'); background-size: 85%; background-position: center; background-repeat: no-repeat; filter: grayscale(100%) brightness(200%);">
                </div>
            `;

            let iconBadge = '';
            if(isHave && details.code !== 'fifa' && details.code !== 'cc') {
                iconBadge = `<div class="absolute bottom-[2px] right-[2px] w-[35%] h-[35%] rounded-full overflow-hidden border border-white shadow-md z-10 bg-white flex items-center justify-center pointer-events-none"><img src="https://flagcdn.com/w40/${details.code}.png" class="w-full h-full object-cover pointer-events-none" /></div>`;
            } else if (isHave && details.code === 'fifa') {
                iconBadge = `<div class="absolute bottom-[2px] right-[2px] w-[35%] h-[35%] rounded-full overflow-hidden border border-white shadow-md z-10 bg-yellow-400 flex items-center justify-center text-[10px] sm:text-xs pointer-events-none">🏆</div>`;
            } else if (isHave && details.code === 'cc') {
                iconBadge = `<div class="absolute bottom-[2px] right-[2px] w-[35%] h-[35%] rounded-full overflow-hidden border border-white shadow-md z-10 bg-red-600 flex items-center justify-center text-[10px] sm:text-xs pointer-events-none">🥤</div>`;
            }

            const borderClass = isSelected ? 'border-[3px] border-green-400 shadow-[0_0_15px_rgba(74,222,128,0.8)] scale-105' : (isMissing ? 'border border-white/20' : 'border-[2px] border-white/90 shadow-md');
            const overlay = isSelected ? `<div class="absolute inset-0 bg-green-400/20 z-20 pointer-events-none rounded-lg"></div><div class="absolute -top-2 -right-2 bg-green-500 text-white rounded-full p-1 z-30 shadow-lg"><i data-lucide="check" class="w-3 h-3"></i></div>` : '';
            const repBadge = reps > 0 && !isSelected ? `<div class="absolute -top-2 -right-2 bg-blue-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border border-white shadow-lg z-20 pointer-events-none">+${reps}</div>` : '';

            return `
                <div class="relative flex justify-center ${customClasses}">
                    <button type="button" ${onClickAttr ? `onclick="${onClickAttr}"` : ''} 
                            class="relative w-full aspect-[3/4] rounded-xl flex items-center justify-center transition-all duration-300 select-none outline-none ${onClickAttr ? 'cursor-pointer touch-manipulation active:scale-95' : 'cursor-default'} ${borderClass} ${isMissing ? 'bg-white/10' : ''}"
                            style="background-color: ${bgColor}">
                        <div class="absolute inset-0 rounded-xl overflow-hidden pointer-events-none">
                            ${maskColorsHtml}
                        </div>
                        <div class="absolute bottom-[2px] left-[2px] w-[35%] h-[35%] rounded-full flex items-center justify-center font-black text-xs shadow-md transition-all z-10 pointer-events-none ${isMissing ? 'bg-black/20 text-white/50 backdrop-blur-sm' : 'bg-white text-gray-900'}">${num}</div>
                        ${iconBadge}
                        ${overlay}
                    </button>
                    ${repBadge}
                </div>
            `;
        }

        function getStickerInnerHtml(team, num) {
            const details = TEAM_DETAILS[team] || { code: 'un', colors: ['#4B5563', '#1F2937', '#000000'] };
            const st = (state.albumData && state.albumData[team] && state.albumData[team][num]) || 0;
            const isMissing = st === 0;
            const isHave = st >= 1;
            const reps = st > 1 ? st - 1 : 0;
            const bgColor = isHave ? details.colors[0] : '';
            
            const maskColorsHtml = isHave ? `
                <div class="absolute inset-0 transition-all duration-300 opacity-90 pointer-events-none"
                     style="background: radial-gradient(ellipse at 50% 50%, ${details.colors[2]} 0%, ${details.colors[2]} 30%, ${details.colors[1]} 31%, ${details.colors[1]} 100%);
                            mask-image: url('${LOGO_URL}'); -webkit-mask-image: url('${LOGO_URL}');
                            mask-size: 85%; -webkit-mask-size: 85%;
                            mask-position: center; -webkit-mask-position: center;
                            mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat;">
                </div>
            ` : `
                <div class="absolute inset-0 mix-blend-overlay opacity-30 pointer-events-none"
                     style="background-image: url('${LOGO_URL}'); background-size: 85%; background-position: center; background-repeat: no-repeat; filter: grayscale(100%) brightness(200%);">
                </div>
            `;

            let iconBadge = '';
            if(isHave && details.code !== 'fifa' && details.code !== 'cc') {
                iconBadge = `<div class="absolute bottom-1 right-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full overflow-hidden border-2 border-white shadow-md z-10 bg-white flex items-center justify-center pointer-events-none"><img src="https://flagcdn.com/w40/${details.code}.png" class="w-full h-full object-cover pointer-events-none" /></div>`;
            } else if (isHave && details.code === 'fifa') {
                iconBadge = `<div class="absolute bottom-1 right-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full overflow-hidden border-2 border-white shadow-md z-10 bg-yellow-400 flex items-center justify-center text-xs pointer-events-none">🏆</div>`;
            } else if (isHave && details.code === 'cc') {
                iconBadge = `<div class="absolute bottom-1 right-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full overflow-hidden border-2 border-white shadow-md z-10 bg-red-600 flex items-center justify-center text-xs pointer-events-none">🥤</div>`;
            }

            return `
                <button type="button" onclick="window.toggleSticker('${team}', ${num})" 
                        class="relative w-full aspect-[3/4] max-w-[80px] rounded-xl flex items-center justify-center transition-all duration-300 select-none outline-none touch-manipulation cursor-pointer active:scale-95 ${isMissing ? 'bg-white/10 border border-white/20 active:bg-white/20 shadow-inner' : 'border-[2px] sm:border-[3px] border-white/90 shadow-[0_8px_15px_rgba(0,0,0,0.3)] sm:hover:-translate-y-1 sm:hover:scale-105'}"
                        style="background-color: ${bgColor}">
                    <div class="absolute inset-0 rounded-xl overflow-hidden pointer-events-none">
                        ${maskColorsHtml}
                    </div>
                    <div class="absolute bottom-1 left-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center font-black text-xs sm:text-sm shadow-md transition-all z-10 pointer-events-none ${isMissing ? 'bg-black/20 text-white/50 backdrop-blur-sm' : 'bg-white text-gray-900'}">${num}</div>
                    ${iconBadge}
                </button>
                ${reps > 0 ? `<div class="absolute -top-3 -right-2 sm:-right-3 bg-blue-500 text-white text-[10px] sm:text-xs font-black w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center border-2 border-white shadow-lg z-20 pointer-events-none">+${reps}</div>` : ''}
            `;
        }

        // Dropdown menu alfabético
        function renderDropdownNavbar() {
            const sortedTeams = [...TEAMS].sort((a,b) => (TEAM_DETAILS[a]?.name || a).localeCompare((TEAM_DETAILS[b]?.name || b)));
            const options = sortedTeams.map(t => `<option value="${t}" class="bg-gray-800">${TEAM_DETAILS[t].name}</option>`).join('');
            return `
            <div class="bg-black/20 backdrop-blur-sm p-4 rounded-2xl border border-white/10 mb-6 shadow-md fade-in flex flex-col sm:flex-row items-center gap-3">
                <div class="text-xs text-white/60 uppercase tracking-widest font-bold flex items-center gap-2 whitespace-nowrap">
                    <i data-lucide="navigation" class="w-4 h-4 pointer-events-none"></i> Búsqueda Rápida:
                </div>
                <div class="relative w-full">
                    <select onchange="window.scrollToTeam(this.value); this.value='';" class="w-full bg-black/40 border border-white/20 text-white font-bold rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-green-400 cursor-pointer text-sm appearance-none">
                        <option value="" disabled selected>Selecciona un país del índice alfabético...</option>
                        ${options}
                    </select>
                    <i data-lucide="chevron-down" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white/50 pointer-events-none w-4 h-4"></i>
                </div>
            </div>
            `;
        }

        function renderAlbum() {
            const stats = calculateStats();
            
            const teamsHtml = TEAMS.map(team => {
                const details = TEAM_DETAILS[team] || { name: team, code: 'un', colors: ['#4B5563', '#1F2937', '#000000'] };
                const count = getStickerCount(team);
                const haveCount = Object.values(state.albumData[team] || {}).filter(s => s > 0).length;
                
                let flagHtml = details.code === 'fifa' ? `<div class="w-8 h-6 sm:w-10 sm:h-7 bg-yellow-500/20 rounded flex items-center justify-center text-yellow-400 border border-yellow-500/50">🏆</div>` : 
                               details.code === 'cc' ? `<div class="w-8 h-6 sm:w-10 sm:h-7 bg-red-500/20 rounded flex items-center justify-center text-red-400 border border-red-500/50">🥤</div>` : 
                               `<img src="https://flagcdn.com/w40/${details.code}.png" alt="${details.name}" class="w-8 sm:w-10 rounded shadow-sm object-cover pointer-events-none" />`;

                let stickersHtml = Array.from({ length: count }).map((_, idx) => {
                    const num = idx + 1;
                    return `<div id="sticker-wrap-${team}-${num}" class="relative flex justify-center">${getStickerInnerHtml(team, num)}</div>`;
                }).join('');

                return `
                <div id="team-section-${team}" class="bg-black/20 backdrop-blur-xl rounded-3xl overflow-hidden border border-white/20 shadow-xl scroll-smooth-offset">
                    <div class="bg-gradient-to-r from-black/60 to-black/20 px-4 py-3 sm:px-5 sm:py-3 border-b border-white/10 flex justify-between items-center backdrop-blur-md">
                        <span class="font-bold text-base sm:text-lg tracking-wide flex items-center gap-3">
                            ${flagHtml} ${details.name}
                        </span>
                        <span id="team-count-${team}" class="text-xs bg-white/20 backdrop-blur-md border border-white/30 px-3 py-1.5 rounded-full font-bold shadow-sm whitespace-nowrap ml-2">
                            ${haveCount} / ${count}
                        </span>
                    </div>
                    <div class="p-3 sm:p-5 grid grid-cols-4 sm:grid-cols-5 md:grid-cols-10 gap-x-2 gap-y-4 sm:gap-4 pt-6">
                        ${stickersHtml}
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="space-y-6">
                <!-- Estadísticas -->
                <div class="bg-black/20 backdrop-blur-xl rounded-2xl p-5 border border-white/20 shadow-lg flex flex-col fade-in">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-white/90 text-lg uppercase tracking-wide">Tu Progreso</h3>
                        <span id="stat-percent" class="text-green-400 font-extrabold text-2xl drop-shadow-md">${stats.percent}%</span>
                    </div>
                    <div class="w-full bg-black/40 rounded-full h-3 mb-5 border border-white/10 overflow-hidden shadow-inner">
                        <div id="stat-bar" class="bg-gradient-to-r from-green-400 to-green-300 h-full rounded-full transition-all duration-1000 shadow-[0_0_10px_rgba(74,222,128,0.5)]" style="width: ${stats.percent}%"></div>
                    </div>
                    
                    <div class="flex flex-wrap items-center justify-between gap-3 text-sm">
                        <div class="flex flex-col items-center bg-white/5 px-2 py-2 rounded-xl border border-white/10 flex-1 min-w-[30%] sm:min-w-[80px]">
                            <span class="text-white/60 text-[10px] sm:text-xs uppercase mb-1 text-center">Obtenidas</span>
                            <span id="stat-collected" class="font-bold text-base sm:text-lg leading-none">${stats.collected} <span class="text-white/40 text-xs sm:text-sm">/ ${TOTAL_STICKERS}</span></span>
                        </div>
                        <div class="flex flex-col items-center bg-white/5 px-2 py-2 rounded-xl border border-white/10 flex-1 min-w-[30%] sm:min-w-[80px]">
                            <span class="text-white/60 text-[10px] sm:text-xs uppercase mb-1 text-center">Faltantes</span>
                            <span id="stat-missing" class="font-bold text-base sm:text-lg leading-none">${TOTAL_STICKERS - stats.collected}</span>
                        </div>
                        <div class="flex flex-col items-center bg-blue-500/10 px-2 py-2 rounded-xl border border-blue-400/30 flex-1 min-w-[30%] sm:min-w-[80px]">
                            <span class="text-blue-300 text-[10px] sm:text-xs uppercase mb-1 text-center">Repetidas</span>
                            <span id="stat-duplicates" class="font-bold text-base sm:text-lg text-blue-300 leading-none">${stats.duplicates}</span>
                        </div>
                        
                        <div class="w-full sm:w-auto mt-2 sm:mt-0 flex justify-end">
                            <button type="button" onclick="window.setShowClearConfirm(true)" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-red-500/10 hover:bg-red-500/30 text-red-300 border border-red-500/40 px-4 py-2.5 rounded-xl transition-all text-xs uppercase font-bold backdrop-blur-md active:scale-95 cursor-pointer touch-manipulation">
                                <i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i> Borrar Todo
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Banderas Alfabéticas -->
                ${renderDropdownNavbar()}

                <!-- MODO SOLO REPETIDAS -->
                <div class="flex items-center justify-between bg-black/30 p-4 rounded-2xl border ${state.isRepetidasMode ? 'border-green-400 shadow-[0_0_15px_rgba(74,222,128,0.3)]' : 'border-white/10'} mb-6 fade-in transition-all">
                    <div class="flex flex-col">
                        <span class="text-base font-bold text-white tracking-wide">SOLO TILDAR REPETIDAS</span>
                        <span class="text-xs text-white/50">Toca para sumar repetidas directamente</span>
                    </div>
                    <label class="flex items-center cursor-pointer touch-manipulation">
                        <div class="relative">
                            <input type="checkbox" class="sr-only toggle-checkbox" onchange="window.toggleRepetidasMode()" ${state.isRepetidasMode ? 'checked' : ''}>
                            <div class="block bg-white/20 w-14 h-8 rounded-full border border-white/30 transition-all toggle-label"></div>
                            <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition-transform"></div>
                        </div>
                    </label>
                </div>

                <!-- Equipos (Sin re-renderizados) -->
                <div class="space-y-8 fade-in">
                    ${teamsHtml}
                </div>
            </div>`;
        }

        function getMarketData() {
            const otherUsers = state.allUsersData.filter(u => u.id !== state.virtualUser.id);
            return otherUsers.map(user => {
                let usefulCount = 0;
                const userDuplicates = []; 
                if (user.album) {
                    Object.entries(user.album).forEach(([team, stickers]) => {
                        Object.entries(stickers).forEach(([numStr, st]) => {
                            if (st > 1) {
                                const num = parseInt(numStr);
                                userDuplicates.push({ team, num, reps: st - 1 });
                                const myState = (state.albumData && state.albumData[team] && state.albumData[team][num]) || 0;
                                if (myState === 0) usefulCount++;
                            }
                        });
                    });
                }
                return { ...user, duplicates: userDuplicates, usefulCount };
            }).sort((a, b) => b.usefulCount - a.usefulCount);
        }

        function renderMarket() {
            const marketData = getMarketData();
            
            if (state.selectedMarketUser) {
                const userMatches = marketData.find(u => u.id === state.selectedMarketUser);
                let dupHtml = userMatches.duplicates.map(dup => {
                    const myState = (state.albumData && state.albumData[dup.team] && state.albumData[dup.team][dup.num]) || 0;
                    const iNeedIt = myState === 0;
                    const stickerVisual = window.getStaticStickerHTML(dup.team, dup.num, 2, '', 'w-14 sm:w-16');

                    return `
                    <div class="flex items-center gap-4 p-3 rounded-2xl border backdrop-blur-md transition-all ${iNeedIt ? 'bg-green-400/20 border-green-400 shadow-[0_0_15px_rgba(74,222,128,0.2)]' : 'bg-white/5 border-white/10 opacity-70'}">
                        ${stickerVisual}
                        <div class="flex flex-col">
                            <span class="font-bold text-lg">${TEAM_DETAILS[dup.team]?.name || dup.team}</span>
                            ${iNeedIt ? `<span class="text-[10px] font-black text-green-300 uppercase tracking-widest mt-1">¡Te Sirve!</span>` : `<span class="text-[10px] text-white/40 uppercase">Ya la tienes</span>`}
                        </div>
                    </div>`;
                }).join('');

                if(userMatches.duplicates.length === 0) dupHtml = `<div class="col-span-full text-center text-white/50 py-10 bg-black/10 rounded-2xl border border-dashed border-white/10">Este usuario no ha subido repetidas.</div>`;

                return `
                <div class="space-y-4 fade-in">
                    <button type="button" onclick="window.setSelectedMarketUser(null)" class="text-white/70 font-medium flex items-center gap-2 hover:text-white active:scale-95 transition bg-black/20 px-4 py-2 rounded-xl backdrop-blur-md border border-white/10 w-max touch-manipulation cursor-pointer">
                        &larr; Volver al mercado
                    </button>
                    <div class="bg-black/20 backdrop-blur-xl rounded-3xl shadow-xl p-6 border-t-[6px] border-t-green-400 border-x border-b border-white/20">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div>
                                <h2 class="text-3xl font-black mb-1 drop-shadow-md">${userMatches.fullName}</h2>
                                <p class="text-white/60 font-medium">Tiene ${userMatches.duplicates.length} figuritas repetidas disponibles.</p>
                            </div>
                            ${userMatches.duplicates.length > 0 ? `
                            <button onclick="window.openTradeDraft('${userMatches.id}')" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all active:scale-95 cursor-pointer flex items-center justify-center gap-2">
                                <i data-lucide="arrow-left-right" class="w-5 h-5"></i> Proponer Intercambio
                            </button>` : ''}
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mt-6">
                            ${dupHtml}
                        </div>
                    </div>
                </div>`;
            }

            let usersHtml = marketData.map(user => `
            <div onclick="window.setSelectedMarketUser('${user.id}')" class="bg-black/20 p-5 rounded-2xl shadow-lg border border-white/10 flex flex-col sm:flex-row sm:items-center justify-between cursor-pointer active:scale-95 sm:hover:border-green-400/50 sm:hover:bg-white/10 transition-all group backdrop-blur-md touch-manipulation gap-4">
                <div class="flex items-center gap-4 pointer-events-none">
                    <div class="w-12 h-12 shrink-0 rounded-xl bg-gradient-to-br from-white/20 to-white/5 flex items-center justify-center text-white font-black text-xl uppercase border border-white/20 group-hover:scale-110 transition-transform shadow-inner">
                        ${user.fullName.charAt(0)}
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-lg tracking-wide">${user.fullName}</h3>
                        <p class="text-xs text-white/50 font-medium mt-0.5">${user.duplicates.length} repetidas publicadas</p>
                    </div>
                </div>
                <div class="flex items-center gap-4 pointer-events-none w-full sm:w-auto justify-between sm:justify-end">
                    ${user.usefulCount > 0 
                        ? `<span class="bg-green-400 text-green-950 text-xs font-black px-4 py-2 rounded-xl shadow-[0_0_10px_rgba(74,222,128,0.3)]">${user.usefulCount} te sirven</span>` 
                        : `<span class="text-xs font-medium text-white/40 bg-white/5 px-3 py-1.5 rounded-lg border border-white/10">Ver Perfil</span>`}
                    <span class="text-white/20 group-hover:text-green-400 group-hover:translate-x-1 transition-all">&rarr;</span>
                </div>
            </div>`).join('');

            if(marketData.length === 0) usersHtml = `<div class="text-center py-16 text-white/50 bg-black/10 rounded-3xl border border-dashed border-white/20 backdrop-blur-sm">Nadie más ha ingresado repetidas al mercado aún.</div>`;

            return `
            <div class="space-y-6 fade-in">
                <div class="bg-gradient-to-r from-blue-600/60 to-purple-600/60 text-white p-8 rounded-3xl shadow-xl relative overflow-hidden backdrop-blur-md border border-white/20">
                    <div class="absolute -right-16 -top-16 w-48 h-48 rounded-full border-[20px] border-white/10"></div>
                    <div class="absolute right-20 -bottom-10 w-24 h-24 rounded-full border-[10px] border-white/5"></div>
                    <h2 class="text-3xl font-black mb-3 drop-shadow-md">Mercado de Intercambios</h2>
                    <p class="opacity-90 max-w-lg text-sm leading-relaxed font-medium">Mira el perfil de otro coleccionista para ver las figuritas visualmente y enviarle una propuesta de intercambio oficial.</p>
                </div>
                <div class="grid gap-4">${usersHtml}</div>
            </div>`;
        }

        // --- RENDER TRADE Y NOTIFICACIONES ---
        function renderTradeDraft() {
            const draft = state.tradeDraft;
            if(!draft) return '';
            
            // Sus repetidas
            const theirDups = draft.toUser.duplicates || [];
            let theirHtml = theirDups.map(dup => {
                const isSelected = draft.request.some(r => r.team === dup.team && r.num === dup.num);
                const sticker = window.getStaticStickerHTML(dup.team, dup.num, 2, `window.toggleTradeItem('request', '${dup.team}', ${dup.num})`, 'w-14 sm:w-16', isSelected);
                return `<div class="shrink-0 snap-center">${sticker}</div>`;
            }).join('');
            if(theirDups.length === 0) theirHtml = `<p class="text-sm text-white/50 py-4">No tiene repetidas disponibles.</p>`;

            // Mis repetidas
            const myDups = getMyDuplicates();
            let myHtml = myDups.map(dup => {
                const isSelected = draft.offer.some(r => r.team === dup.team && r.num === dup.num);
                const sticker = window.getStaticStickerHTML(dup.team, dup.num, 2, `window.toggleTradeItem('offer', '${dup.team}', ${dup.num})`, 'w-14 sm:w-16', isSelected);
                return `<div class="shrink-0 snap-center">${sticker}</div>`;
            }).join('');
            if(myDups.length === 0) myHtml = `<p class="text-sm text-white/50 py-4">No tienes repetidas para ofrecer.</p>`;

            return `
            <div class="space-y-6 fade-in">
                <button type="button" onclick="window.setTab('market')" class="text-white/70 font-medium flex items-center gap-2 hover:text-white transition bg-black/20 px-4 py-2 rounded-xl backdrop-blur-md border border-white/10 w-max cursor-pointer">
                    &larr; Cancelar
                </button>
                <div class="bg-black/20 backdrop-blur-xl rounded-3xl p-6 border border-white/20">
                    <h2 class="text-2xl font-black mb-6">Propuesta para ${draft.toUser.fullName}</h2>
                    
                    <div class="mb-8">
                        <h3 class="text-sm uppercase text-green-400 font-bold tracking-widest mb-3">1. Tocá las que le pides:</h3>
                        <div class="flex overflow-x-auto gap-4 pb-4 snap-x border-b border-white/10" style="scrollbar-width: thin;">
                            ${theirHtml}
                        </div>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-sm uppercase text-blue-400 font-bold tracking-widest mb-3">2. Tocá las que le ofreces:</h3>
                        <div class="flex overflow-x-auto gap-4 pb-4 snap-x" style="scrollbar-width: thin;">
                            ${myHtml}
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center gap-4 bg-black/30 p-4 rounded-xl border border-white/10">
                        <div class="flex-1 text-sm font-medium text-white/70">
                            Pides: <strong class="text-white">${draft.request.length}</strong> | Ofreces: <strong class="text-white">${draft.offer.length}</strong>
                        </div>
                        <button onclick="window.sendTradeProposal()" class="w-full sm:w-auto bg-green-500 hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all cursor-pointer flex items-center gap-2" ${draft.request.length === 0 && draft.offer.length === 0 ? 'disabled' : ''}>
                            <i data-lucide="send" class="w-5 h-5"></i> Enviar Propuesta
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function renderNotifications() {
            const incoming = state.tradesData.filter(t => t.toId === state.virtualUser.id && t.status === 'pending');
            const history = state.tradesData.filter(t => (t.fromId === state.virtualUser.id || t.toId === state.virtualUser.id) && t.status !== 'pending').sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 10);

            let incHtml = incoming.map(trade => {
                const getItemsHtml = (list) => list.map(item => window.getStaticStickerHTML(item.team, item.num, 1, '', 'w-12 sm:w-14')).join('');
                
                return `
                <div class="bg-gradient-to-br from-blue-900/40 to-black/40 p-5 rounded-2xl border border-blue-400/30 shadow-lg mb-4">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center border border-blue-400 text-blue-300">
                            <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
                        </div>
                        <h3 class="font-bold text-lg">${trade.fromName} te propone un cambio</h3>
                    </div>
                    
                    <div class="grid sm:grid-cols-2 gap-4 mb-6">
                        <div class="bg-black/30 p-3 rounded-xl border border-white/5">
                            <span class="text-xs uppercase text-green-400 font-bold block mb-2">Recibes (Ofrece él):</span>
                            <div class="flex flex-wrap gap-2">${getItemsHtml(trade.offer)}</div>
                        </div>
                        <div class="bg-black/30 p-3 rounded-xl border border-white/5">
                            <span class="text-xs uppercase text-red-400 font-bold block mb-2">Entregas (Pide él):</span>
                            <div class="flex flex-wrap gap-2">${getItemsHtml(trade.request)}</div>
                        </div>
                    </div>
                    
                    <div class="flex gap-3">
                        <button onclick="window.respondTrade('${trade.id}', 'rejected')" class="flex-1 py-3 rounded-xl font-bold text-white bg-red-500/20 hover:bg-red-500/40 border border-red-500/50 transition-all cursor-pointer">Rechazar</button>
                        <button onclick="window.respondTrade('${trade.id}', 'accepted')" class="flex-1 py-3 rounded-xl font-bold text-white bg-green-500 hover:bg-green-600 shadow-[0_0_15px_rgba(34,197,94,0.4)] transition-all cursor-pointer">¡Aceptar Cambio!</button>
                    </div>
                </div>`;
            }).join('');
            if (incoming.length === 0) incHtml = `<div class="text-center py-10 text-white/50 bg-black/10 rounded-2xl border border-dashed border-white/10 mb-8">No tienes propuestas de intercambio pendientes.</div>`;

            let histHtml = history.map(trade => {
                const isAccepted = trade.status === 'accepted';
                const color = isAccepted ? 'text-green-400' : 'text-red-400';
                const verb = trade.fromId === state.virtualUser.id ? 'Enviaste a' : 'Recibiste de';
                const otherName = trade.fromId === state.virtualUser.id ? trade.toName : trade.fromName;
                return `
                <div class="flex items-center justify-between p-3 border-b border-white/10 last:border-0">
                    <div>
                        <p class="text-sm font-medium text-white/80">${verb} <strong>${otherName}</strong></p>
                        <p class="text-xs text-white/40">${new Date(trade.timestamp).toLocaleDateString()}</p>
                    </div>
                    <span class="text-xs font-bold uppercase ${color} border border-current px-2 py-1 rounded-full">${isAccepted ? 'Aceptado' : 'Rechazado'}</span>
                </div>`;
            }).join('');

            return `
            <div class="space-y-6 fade-in">
                <h2 class="text-2xl font-black flex items-center gap-2"><i data-lucide="bell" class="w-6 h-6"></i> Notificaciones</h2>
                <div>
                    <h3 class="text-sm text-white/60 uppercase tracking-widest font-bold mb-4">Propuestas Pendientes</h3>
                    ${incHtml}
                </div>
                ${history.length > 0 ? `
                <div>
                    <h3 class="text-sm text-white/60 uppercase tracking-widest font-bold mb-4 mt-8">Historial Reciente</h3>
                    <div class="bg-black/20 rounded-2xl border border-white/10 p-2">
                        ${histHtml}
                    </div>
                </div>` : ''}
            </div>`;
        }

        // --- DIBUJADO DE LA APLICACIÓN PRINCIPAL ---
        function renderApp() {
            const pendingCount = state.tradesData.filter(t => t.toId === state.virtualUser.id && t.status === 'pending').length;

            return `
            <!-- HEADER -->
            <div class="sticky top-0 z-50 px-4 py-3 bg-black/20 backdrop-blur-xl border-b border-white/20 shadow-lg flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <img src="${LOGO_URL}" alt="Logo" class="h-8 sm:h-10 w-auto object-contain filter drop-shadow-md pointer-events-none" />
                    <span class="font-bold tracking-widest text-xs sm:text-sm uppercase hidden sm:inline-block opacity-80 pointer-events-none">Planilla Mundial 2026</span>
                </div>
                <div class="flex items-center gap-3 sm:gap-4">
                    <span class="text-xs sm:text-sm font-medium bg-white/10 px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-2 backdrop-blur-md">
                        <i data-lucide="user" class="w-3 h-3 sm:w-4 sm:h-4 pointer-events-none"></i> <span class="truncate max-w-[80px] sm:max-w-none">${state.virtualUser.fullName.split(' ')[0]}</span>
                    </span>
                    <button type="button" onclick="window.setTab('notifications')" class="relative text-white p-2 rounded-full hover:bg-white/10 active:scale-95 transition border border-transparent hover:border-white/20 backdrop-blur-md touch-manipulation cursor-pointer">
                        <i data-lucide="bell" class="w-5 h-5 pointer-events-none"></i>
                        ${pendingCount > 0 ? `<span class="absolute top-[2px] right-[2px] bg-red-500 w-3 h-3 rounded-full border border-black shadow-md pointer-events-none"></span>` : ''}
                    </button>
                    <button type="button" onclick="window.handleLogout()" class="text-red-300 hover:text-white p-2 rounded-full hover:bg-red-500/30 active:scale-95 transition border border-transparent hover:border-red-400/50 backdrop-blur-md touch-manipulation cursor-pointer">
                        <i data-lucide="log-out" class="w-5 h-5 pointer-events-none"></i>
                    </button>
                </div>
            </div>
            
            <!-- TABS -->
            <div class="flex px-4 pt-4 gap-2 max-w-4xl mx-auto">
                <button type="button" onclick="window.setTab('album')" class="flex-1 py-3 text-sm font-bold flex justify-center items-center gap-2 rounded-t-2xl transition-all duration-300 backdrop-blur-md border border-b-0 touch-manipulation cursor-pointer ${state.currentTab === 'album' ? 'bg-white/20 border-white/40 text-white shadow-[0_-5px_15px_rgba(255,255,255,0.1)]' : 'bg-black/10 border-white/10 text-white/60 hover:bg-white/10'}">
                    <i data-lucide="book" class="w-4 h-4 pointer-events-none"></i> <span class="pointer-events-none">Mi Álbum</span>
                </button>
                <button type="button" onclick="window.setTab('market')" class="flex-1 py-3 text-sm font-bold flex justify-center items-center gap-2 rounded-t-2xl transition-all duration-300 backdrop-blur-md border border-b-0 touch-manipulation cursor-pointer ${state.currentTab === 'market' || state.currentTab === 'trade' ? 'bg-white/20 border-white/40 text-white shadow-[0_-5px_15px_rgba(255,255,255,0.1)]' : 'bg-black/10 border-white/10 text-white/60 hover:bg-white/10'}">
                    <i data-lucide="users" class="w-4 h-4 pointer-events-none"></i> <span class="pointer-events-none">Mercado</span>
                </button>
            </div>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="p-4 max-w-4xl mx-auto bg-white/10 backdrop-blur-md border border-white/20 rounded-b-3xl rounded-tr-3xl shadow-2xl min-h-[70vh]">
                ${state.currentTab === 'album' ? renderAlbum() : state.currentTab === 'trade' ? renderTradeDraft() : state.currentTab === 'notifications' ? renderNotifications() : renderMarket()}
            </main>

            <!-- MODAL BORRAR -->
            <div id="modal-container"></div>
            `;
        }

        // --- SISTEMA DE DIBUJADO BASE ---
        function renderLogin() {
            let userOptions = state.allUsersData.map(u => `<option value="${u.id}" class="bg-gray-800 text-white">${u.fullName}</option>`).join('');
            
            return `
            <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                <div class="absolute top-20 left-20 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob pointer-events-none"></div>
                <div class="absolute top-20 right-20 w-72 h-72 bg-green-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000 pointer-events-none"></div>
                <div class="absolute -bottom-8 left-1/2 w-72 h-72 bg-red-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-4000 pointer-events-none"></div>

                <div class="bg-white/10 backdrop-blur-2xl p-8 rounded-3xl shadow-2xl w-full max-w-md z-10 border border-white/20 relative fade-in">
                    <div class="text-center mb-8 flex flex-col items-center">
                        <div class="bg-white/20 p-4 rounded-2xl backdrop-blur-md border border-white/30 mb-4 shadow-xl pointer-events-none">
                            <img src="${LOGO_URL}" alt="Mundial 2026" class="w-32 object-contain" />
                        </div>
                        <h2 class="text-2xl font-bold tracking-wide">Álbum Virtual</h2>
                        <p class="text-white/70 text-sm mt-1">Lleva el control de tus figuritas</p>
                    </div>
                    
                    ${state.dbError ? `
                        <div class="bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl mb-6 text-sm text-center font-medium backdrop-blur-md">
                            ❌ <b>Atención:</b><br/>${state.dbError}
                        </div>
                    ` : ''}

                    ${state.allUsersData.length > 0 ? `
                        <div class="flex bg-black/20 rounded-xl p-1 mb-6 backdrop-blur-sm border border-white/10">
                            <button onclick="window.setNewUserMode(false)" type="button" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all cursor-pointer ${!state.isNewUserMode ? 'bg-white/20 shadow-md text-white' : 'text-white/50 hover:text-white'}">Entrar</button>
                            <button onclick="window.setNewUserMode(true)" type="button" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-1 cursor-pointer ${state.isNewUserMode ? 'bg-white/20 shadow-md text-white' : 'text-white/50 hover:text-white'}"><i data-lucide="user-plus" class="w-4 h-4 pointer-events-none"></i> Nuevo</button>
                        </div>
                    ` : ''}

                    <form onsubmit="window.handleLoginSubmit(event)" class="space-y-5">
                        ${state.isNewUserMode ? `
                            <div>
                                <label class="block text-xs font-medium text-white/70 mb-1 ml-1 uppercase tracking-wider">Nombre Completo</label>
                                <input type="text" id="loginName" required placeholder="Ej: Juan Perez" class="w-full px-4 py-3 bg-black/20 border border-white/20 rounded-xl focus:ring-2 focus:ring-white/50 outline-none transition text-white placeholder-white/30 backdrop-blur-sm" />
                            </div>
                        ` : `
                            <div>
                                <label class="block text-xs font-medium text-white/70 mb-1 ml-1 uppercase tracking-wider">Selecciona tu Usuario</label>
                                <div class="relative">
                                    <select id="loginSelect" class="w-full px-4 py-3 bg-black/20 border border-white/20 rounded-xl focus:ring-2 focus:ring-white/50 outline-none transition appearance-none text-white backdrop-blur-sm cursor-pointer">
                                        ${userOptions}
                                    </select>
                                    <i data-lucide="chevron-down" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white/50 pointer-events-none w-4 h-4"></i>
                                </div>
                            </div>
                        `}
                        <div>
                            <label class="block text-xs font-medium text-white/70 mb-1 ml-1 uppercase tracking-wider">PIN (4 Dígitos)</label>
                            <input type="password" id="loginPin" required maxlength="4" pattern="\\d{4}" placeholder="••••" oninput="this.value=this.value.replace(/\\D/g, '')" class="w-full px-4 py-3 bg-black/20 border border-white/20 rounded-xl focus:ring-2 focus:ring-white/50 outline-none text-center tracking-[1em] text-xl font-bold transition text-white placeholder-white/30 backdrop-blur-sm" />
                        </div>
                        <button type="submit" ${state.loading ? 'disabled' : ''} class="w-full bg-white/20 hover:bg-white/30 text-white border border-white/40 font-bold py-3 rounded-xl transition-all duration-300 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer flex justify-center items-center shadow-lg hover:shadow-xl backdrop-blur-md mt-2">
                            ${state.loading ? '<div class="animate-spin rounded-full h-5 w-5 border-t-2 border-b-2 border-white"></div>' : (state.isNewUserMode ? "Crear y Entrar" : "Ingresar")}
                        </button>
                    </form>
                </div>
            </div>`;
        }

        function render() {
            const appDiv = document.getElementById('app');
            if (state.loading && !state.firebaseUser) return;
            if (!state.virtualUser) appDiv.innerHTML = renderLogin();
            else appDiv.innerHTML = renderApp();
            renderModalOnly();
            loadIconsSafely();
        }

        function renderModalOnly() {
            const modalContainer = document.getElementById('modal-container');
            if(!modalContainer) return;
            if(state.showClearConfirm) {
                modalContainer.innerHTML = `
                <div class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md fade-in touch-manipulation">
                    <div class="bg-gradient-to-br from-gray-900 to-black border border-white/20 p-6 rounded-3xl shadow-2xl max-w-sm w-full text-center pointer-events-auto">
                        <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/50 text-red-400">
                            <i data-lucide="alert-triangle" class="w-8 h-8 pointer-events-none"></i>
                        </div>
                        <h3 class="text-xl font-black text-white mb-2">¿Borrar todo el progreso?</h3>
                        <p class="text-white/60 text-sm mb-6">Esta acción no se puede deshacer. Volverás a tener 0 figuritas.</p>
                        <div class="flex gap-3">
                            <button type="button" onclick="window.setShowClearConfirm(false)" class="flex-1 py-3 rounded-xl font-bold text-white bg-white/10 hover:bg-white/20 active:scale-95 border border-white/10 transition-all touch-manipulation cursor-pointer">Cancelar</button>
                            <button type="button" onclick="window.handleClearAlbum()" class="flex-1 py-3 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 active:scale-95 shadow-[0_0_15px_rgba(220,38,38,0.5)] transition-all touch-manipulation cursor-pointer">Sí, borrar</button>
                        </div>
                    </div>
                </div>`;
                loadIconsSafely();
            } else modalContainer.innerHTML = '';
        }

        // Arrancar
        init();
    </script>
</body>
</html>
